{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="h5 mb-4">{{ title }}</h2>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary btn-icon-text" type="submit"><i class="bi bi-save me-1"></i>Guardar</button>
            <a class="btn btn-secondary" href="{% url 'expense_list' %}">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
