{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Nueva cosecha</h1>
                <p class="text-muted">Primero registra el evento agrícola. En el siguiente paso ingresarás el producto y la cantidad a inventario.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Continuar al registro de inventario</button>
                    <a class="btn btn-secondary" href="{% url 'harvest_list' %}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
